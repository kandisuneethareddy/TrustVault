services:
  - type: web
    name: trustvault
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_ENCRYPTION_KEY
        generateValue: true

